[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26160-ipsec-analyzer"
version = "0.1.0"
description = "Evidence-first IPsec capture analyzer"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ipsec-analyzer = "ipsec_analyzer.ingestion.cli:main"
ipsec-analyzer-live = "ipsec_analyzer.ingestion.live:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
